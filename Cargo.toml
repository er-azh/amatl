[package]
name = "amatl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Renders reMarkable v6 .rm notebooks to PDF and PNG the way xochitl does, pixel for pixel"
license = "CC0-1.0 AND IJG"
readme = "README.md"
keywords = ["remarkable", "rm", "pdf", "notebook", "render"]
categories = ["rendering", "parser-implementations", "command-line-utilities"]

[dependencies]
pdf-writer = "0.15.0"
png = "0.18.1"
rustybuzz = "0.20.1"
serde_json = "1.0.154"
skrifa = "0.49.0"
subsetter = { version = "0.2.6", default-features = false }
miniz_oxide = "0.8.9"
thiserror = "2.0.21"
lopdf = { version = "0.39", default-features = false }
